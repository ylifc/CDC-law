<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1190" viewBox="0 0 1600 1190" role="img" aria-labelledby="title description">
<title id="title">CDC Law 疾控法律知识库技术架构</title>
<desc id="description">分类 PDF 和 JSON 元数据经文本解析、条文切分和 PaddleOCR 补充，形成包含 397 份文档、17039 条片段的 JSONL。SQLite FTS5 与使用 1024 维 qwen3-embedding:0.6b 的 Qdrant 分别提供关键词和语义检索，由 RRF 融合后交给本地 Ollama 问答，并输出来源引用和 CLI、HTTP、OpenAI 兼容接口。官网补充资料单独保存为待核对候选，不自动入库。</desc>
